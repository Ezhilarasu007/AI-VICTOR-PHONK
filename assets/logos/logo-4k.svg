<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="3840" height="2160" fill="#030712"/>
  <circle cx="1920" cy="1080" r="600" fill="url(#grad1)" filter="url(#glow)" opacity="0.3"/>
  <text x="1920" y="1000" font-family="Arial, sans-serif" font-size="200" font-weight="bold" fill="url(#grad1)" text-anchor="middle" filter="url(#glow)">AI VICTOR</text>
  <text x="1920" y="1300" font-family="Arial, sans-serif" font-size="180" font-weight="bold" fill="#eef6ff" text-anchor="middle">PHONK</text>
  <text x="1920" y="1550" font-family="Arial, sans-serif" font-size="80" fill="#b5c7e6" text-anchor="middle">Create. Feel. Play. Victorize.</text>
</svg>
